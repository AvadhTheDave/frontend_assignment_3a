<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <picture class="page-background" aria-hidden="true">
            <source srcset="images/background-small.jpg" media="(max-width: 375px)">
            <source srcset="images/background-medium.jpg" media="(max-width: 768px)">
            <img src="images/background-large.jpeg" alt="">
        </picture>
        <section class="calculator" aria-label="Calculator">
            <div id="display" aria-live="polite">0</div>
            <div class="buttons">
                <button class="clear" data-value="clear">Clear</button>
                <button class="backspace" data-value="backspace" aria-label="Backspace">⌫</button>
                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button data-value="/">/</button>
                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button data-value="*">*</button>
                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button data-value="-">-</button>
                <button class="zero" data-value="0">0</button>
                <button class="equals" data-value="=" aria-label="Equals">=</button>
                <button data-value="+">+</button>
            </div>
        </section>
    </main>
</body>
</html>
